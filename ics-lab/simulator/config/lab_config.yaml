# ICS-SHIELD Laboratory Simulator Configuration File
# Isolated laboratory environment setup - DO NOT use public IP addresses.

simulation:
  mode: "REAL_TIME"            # REAL_TIME or ACCELERATED
  time_scale: 1.0              # Multiplier for simulation clock
  telemetry_interval: 1.0      # Telemetry tick interval in seconds
  event_interval: 2.0          # Synthetic protocol event tick interval
  backend_url: "http://localhost:5050/api"
  lab_subnet: "10.10.0.0/16"

process:
  name: "Industrial Water Treatment & Filtration Loop"
  update_step: 1.0             # Step size in seconds
  initial_state: "NORMAL"      # STARTUP, NORMAL, HIGH_LOAD, LOW_LOAD, MAINTENANCE, SHUTDOWN
  variables:
    tank_level:
      min: 0.0
      max: 100.0
      initial: 50.0
      normal_min: 20.0
      normal_max: 90.0
      unit: "%"
    temperature:
      min: 0.0
      max: 120.0
      initial: 72.0
      normal_min: 65.0
      normal_max: 82.0
      unit: "°C"
    pressure:
      min: 0.0
      max: 10.0
      initial: 4.8
      normal_min: 3.0
      normal_max: 6.5
      unit: "bar"
    flow_rate:
      min: 0.0
      max: 250.0
      initial: 120.0
      normal_min: 90.0
      normal_max: 160.0
      unit: "L/min"
    pump_speed:
      min: 0.0
      max: 3000.0
      initial: 1450.0
      unit: "RPM"
    valve_position:
      min: 0.0
      max: 100.0
      initial: 60.0
      unit: "%"

