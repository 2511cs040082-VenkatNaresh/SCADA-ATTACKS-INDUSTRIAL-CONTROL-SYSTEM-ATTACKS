name: Build & Release Windows Desktop Installer

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release Notes / Changelog'
        required: false
        default: 'Production release of ICS-SHIELD Windows Desktop Platform.'

permissions:
  contents: write

jobs:
  validate-and-test:
    name: Run Platform Verification Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install Python Detection Engine Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f detection-engine/requirements.txt ]; then pip install -r detection-engine/requirements.txt; fi

      - name: Execute 19-Suite Automated Tests
        run: node tests/run_all_tests.js

  build-windows-installer:
    name: Compile Windows x64 NSIS Installer
    needs: validate-and-test
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build Frontend SOC UI
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Install and Build Website Platform
        working-directory: ./website
        run: |
          npm ci
          npm run build

      - name: Package Windows Desktop Application
        working-directory: ./desktop
        run: |
          npm install
          npx electron-builder --win nsis --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute SHA-256 Checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "desktop/dist-electron/ICS-SHIELD-Setup-*.exe" | Select-Object -First 1
          if ($null -eq $installer) {
            Write-Error "Installer executable not found in desktop/dist-electron/"
            exit 1
          }
          $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLower()
          $filename = $installer.Name
          "$hash  $filename" | Out-File -FilePath "desktop/dist-electron/sha256.txt" -Encoding ascii
          Write-Host "Generated SHA-256 for $filename: $hash"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: "ICS-SHIELD v1.0.0 Production Release"
          body: |
            ## ICS-SHIELD — SCADA Attacks & Industrial Control System Attacks
            **Architect & Developer:** Venkat Naresh
            **Release Version:** v1.0.0
            **Platform Target:** Windows 10 / 11 (64-bit)

            ### Verified Security Modules
            - Real-Time SCADA Monitoring & Asset State Tracking
            - Multi-Protocol Inspection (Modbus TCP, DNP3, S7comm)
            - Hybrid Detection (Rule Engine + Z-Score Behavioral + ML Isolation Forest)
            - Automated Incident Investigation & MITRE ATT&CK for ICS v14 Mapping
            - Defensive Response Playbooks & Attack Simulation Lab
            - Cryptographically Signed SOC Security Reports

            ### Integrity Verification
            Verify your download using SHA-256:
            ```bash
            CertUtil -hashfile ICS-SHIELD-Setup-1.0.0.exe SHA256
            ```
            Compare the output against the attached `sha256.txt`.

            ${{ github.event.inputs.release_notes }}
          files: |
            desktop/dist-electron/ICS-SHIELD-Setup-*.exe
            desktop/dist-electron/sha256.txt
          draft: false
          prerelease: false
